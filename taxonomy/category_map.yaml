# Every function id in functions.yaml, assigned to one subcategory in
# categories.yaml. 227 ids, each appearing exactly once. The subcategory implies
# the category, so this file is the single source of truth for both.
# Validate with scripts/check_category_map.py.
#
# Categories cut across domains on purpose. A domain says what an ability is about;
# a category says what wanting it says about you. So `make-darkness` leaves the
# creation domain for guile/unseen, and `repair-an-object` leaves restoration for
# invention/fabrication. Every such crossing carries a `#` note giving the reason.
#
# The violence and affliction domains are deliberately NOT kept together -- see the
# header of categories.yaml. They are split by method: the honest blow
# (valor/force-of-arms), the contest of position (valor/grip), the unfair one
# (guile/undermining), the unleashed element (invention/unleashing), the assault on
# a mind (fellowship/pressure).

