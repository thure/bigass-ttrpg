# Every function id in functions.yaml, assigned to one category in categories.yaml.
# 227 ids, each appearing exactly once. Validate with scripts/check_category_map.py.
#
# Categories cut across domains on purpose. A domain says what an ability is about;
# a category says what wanting it says about you. So `make-darkness` leaves the
# creation domain for Cunning, and `repair-an-object` leaves restoration for
# Invention. Every such crossing carries a `#` note giving the reason.

